[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypdb"
# The version is derived from the git tag by setuptools-scm; see
# [tool.setuptools_scm] below. Never edit a version by hand.
dynamic = ["version"]
description = "A Python wrapper for the RCSB Protein Data Bank (PDB) API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "William Gilpin", email = "firstnamelastname@gmail.com" },
]
keywords = ["protein", "pdb", "rcsb", "api", "bioinformatics"]
dependencies = [
  "pip>=26.0.1",
  "requests>=2.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0",
]
notebooks = [
  "ipykernel>=6.0",
  "ipython>=8.0",
  "jupyter>=1.0",
  "matplotlib>=3.5",
  "numpy>=1.23",
  "scikit-learn>=1.2",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/williamgilpin/pypdb"
Repository = "https://github.com/williamgilpin/pypdb"
Issues = "https://github.com/williamgilpin/pypdb/issues"

[tool.pytest.ini_options]
# Jupyter leaves stale copies of source and test files in these directories;
# collecting them would run outdated code.
norecursedirs = [".*", "build", "dist", "*.egg-info", ".ipynb_checkpoints"]

[tool.setuptools_scm]
# Writes the resolved version into the package at build time, so
# `pypdb.__version__` always matches the tag that produced the release.
version_file = "pypdb/_version.py"

[tool.setuptools.packages.find]
include = ["pypdb*"]
